<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة وصال - استخراج الشهادات</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f8ff; color: #333; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #0056b3; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #0056b3; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
        button:hover { background-color: #004494; }
        .price { text-align: center; color: #d9534f; font-weight: bold; font-size: 20px; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>💙 خدمة وصال ديما معاك</h2>
    <p style="text-align: center;">الرجاء ملء البيانات بدقة لاستخراج الشهادة</p>
    
    <div class="input-group">
        <label>اسم الطالب:</label>
        <input type="text" id="name" placeholder="الاسم الرباعي">
    </div>
    <div class="input-group">
        <label>رقم الجلوس:</label>
        <input type="text" id="seat">
    </div>
    <div class="input-group">
        <label>اسم المدرسة:</label>
        <input type="text" id="school">
    </div>
    <div class="input-group">
        <label>سنة الامتحان:</label>
        <input type="number" id="year" value="2024">
    </div>
    <div class="input-group">
        <label>ولاية الامتحان:</label>
        <input type="text" id="state">
    </div>
    <div class="input-group">
        <label>النسبة بالضبط:</label>
        <input type="text" id="percent">
    </div>
    <div class="input-group">
        <label>اسم الوالدة:</label>
        <input type="text" id="mother">
    </div>
    <div class="input-group">
        <label>لغة نسخة الشهادة:</label>
        <select id="lang">
            <option value="عربي">عربي (يتطلب الرقم الوطني)</option>
            <option value="إنجليزي">إنجليزي (يتطلب الجواز)</option>
        </select>
    </div>

    <p class="price">السعر: 150 ألف جنيه 🔥</p>
    <button onclick="sendToWA()">إرسال البيانات عبر واتساب</button>
</div>

<script>
    function sendToWA() {
        const phone = "249XXXXXXXXX"; // ضع رقمك هنا مفتاح الدولة ثم الرقم
        const name = document.getElementById('name').value;
        const seat = document.getElementById('seat').value;
        const school = document.getElementById('school').value;
        const year = document.getElementById('year').value;
        const state = document.getElementById('state').value;
        const percent = document.getElementById('percent').value;
        const mother = document.getElementById('mother').value;
        const lang = document.getElementById('lang').value;

        const message = `*طلب استخراج شهادة - خدمة وصال*%0A` +
                        `🔵 اسم الطالب: ${name}%0A` +
                        `🔵 رقم الجلوس: ${seat}%0A` +
                        `🔵 اسم المدرسة: ${school}%0A` +
                        `🔵 سنة الامتحان: ${year}%0A` +
                        `🔵 ولاية الامتحان: ${state}%0A` +
                        `🔵 النسبة: ${percent}%0A` +
                        `🔵 اسم الوالدة: ${mother}%0A` +
                        `🔵 اللغة: ${lang}%0A` +
                        `*سيتم إرفاق إثبات الشخصية الآن.*`;

        window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
    }
</script>
</body>
</html>
